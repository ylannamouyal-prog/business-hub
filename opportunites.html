<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Hub — Opportunités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #14120f;
    --bg-panel: #1c1914;
    --bg-panel-raised: #242019;
    --border: #332d24;
    --gold: #c9a35f;
    --gold-soft: rgba(201, 163, 95, 0.14);
    --red: #c47456;
    --red-soft: rgba(196, 116, 86, 0.14);
    --orange: #c99a5f;
    --orange-soft: rgba(201, 154, 95, 0.14);
    --yellow: #b8ab6e;
    --yellow-soft: rgba(184, 171, 110, 0.14);
    --green: #7fa46b;
    --text: #ede7db;
    --text-dim: #a89d89;
    --text-faint: #6f6455;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; line-height: 1.5; }
  .shell { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
  header.top h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; margin: 0; }
  header.top .tag { color: var(--text-faint); font-size: 13px; }

  nav.tabs { display: flex; gap: 18px; margin: 20px 0 32px; }
  nav.tabs a { color: var(--text-dim); text-decoration: none; font-size: 14px; padding-bottom: 6px; border-bottom: 2px solid transparent; }
  nav.tabs a.active { color: var(--gold); border-color: var(--gold); }

  h2.section-title {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    color: var(--gold);
    margin: 32px 0 16px;
  }
  h2.section-title:first-of-type { margin-top: 0; }

  .empty { color: var(--text-faint); font-size: 14px; padding: 24px 0; text-align: center; }

  .opp-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--yellow);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .opp-card.high { border-left-color: var(--red); }
  .opp-card.medium { border-left-color: var(--orange); }

  .opp-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .opp-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; }
  .opp-sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

  .opp-score {
    flex-shrink: 0;
    font-size: 12.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: var(--radius);
  }
  .opp-score.high { background: var(--red-soft); color: var(--red); }
  .opp-score.medium { background: var(--orange-soft); color: var(--orange); }
  .opp-score.low { background: var(--yellow-soft); color: var(--yellow); }

  .opp-reasons { margin-top: 8px; font-size: 13px; color: var(--text-dim); }
  .opp-reasons div { margin-top: 2px; }

  .opp-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .opp-actions button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 11px;
    border-radius: var(--radius);
    font-size: 12.5px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .opp-actions button:hover { border-color: var(--gold); color: var(--gold); }
  .opp-actions button.primary { border-color: var(--gold); color: var(--gold); }

  .msg-box { margin-top: 10px; display: none; }
  .msg-box textarea {
    width: 100%;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: var(--radius);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    resize: vertical;
  }
  .msg-copy {
    margin-top: 6px;
    background: var(--gold);
    color: #1c1914;
    border: none;
    padding: 7px 14px;
    border-radius: var(--radius);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .suivi-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .suivi-info .name { font-size: 14px; font-weight: 600; }
  .suivi-info .meta { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; }

  select.suivi-select {
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: var(--radius);
    font-size: 12.5px;
    font-family: 'Inter', sans-serif;
  }
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <h1>Business Hub</h1>
    <span class="tag">Opportunités — AYL Conciergerie / NexTCG</span>
  </header>

  <nav class="tabs">
    <a href="index.html">Clients</a>
    <a href="stock.html">Stock</a>
    <a href="opportunites.html" class="active">Opportunités</a>
  </nav>

  <h2 class="section-title">🎯 Clients à contacter</h2>
  <div id="opp-list"><div class="empty">Analyse en cours…</div></div>

  <h2 class="section-title">Suivi des propositions</h2>
  <div id="suivi-list"><div class="empty">Chargement…</div></div>
</div>

<script>
  const SUPABASE_URL = "https://ziacdbshrsklftxlkcyo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppYWNkYnNocnNrbGZ0eGxrY3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDcyOTUsImV4cCI6MjEwNDk4MzI5NX0.9gMbDnuJ9ZMHIR-a-LUuq1iyD-Un-qaLOTVfZLOQZ8E";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const oppListEl = document.getElementById('opp-list');
  const suiviListEl = document.getElementById('suivi-list');

  // --- Scoring (même logique que dans stock.html) ---
  function computeMatch(client, produit, achats) {
    let score = 0;
    const reasons = [];
    achats = achats || [];

    const cats = (client.categories_preferees || []).map(c => c.toLowerCase());
    const marques = (client.marques_preferees || []).map(m => m.toLowerCase());

    if (produit.categorie && cats.includes(produit.categorie.toLowerCase())) {
      score += 30;
      reasons.push(`Intéressé par la catégorie « ${produit.categorie} »`);
    }
    if (produit.marque && marques.includes(produit.marque.toLowerCase())) {
      score += 30;
      reasons.push(`A déjà une préférence pour la marque ${produit.marque}`);
    }

    // Centres d'intérêt / sports (surtout utile pour la billetterie)
    if (produit.details && produit.details.sport) {
      const interets = (client.centres_interet || []).map(c => c.toLowerCase());
      if (interets.includes(produit.details.sport.toLowerCase())) {
        score += 35;
        reasons.push(`Pratique/aime ${produit.details.sport}`);
      }
    }

    const achatMemeCategorie = produit.categorie && achats.find(a => a.categorie && a.categorie.toLowerCase() === produit.categorie.toLowerCase());
    if (achatMemeCategorie) {
      score += 15;
      reasons.push(`A déjà acheté dans la catégorie « ${produit.categorie} » (${achatMemeCategorie.nom_produit})`);
    }

    if (produit.marque) {
      const achatMemeMarque = achats.find(a => a.marque && a.marque.toLowerCase() === produit.marque.toLowerCase());
      if (achatMemeMarque) {
        score += 10;
        reasons.push(`A déjà acheté la marque ${produit.marque} (${achatMemeMarque.nom_produit})`);
      }
    }

    const min = client.budget_min != null ? Number(client.budget_min) : null;
    const max = client.budget_max != null ? Number(client.budget_max) : null;
    const prix = Number(produit.prix);

    if (min != null && max != null) {
      if (prix >= min && prix <= max) {
        score += 15;
        reasons.push(`Prix dans son budget habituel (${min} € – ${max} €)`);
      }
    } else if (client.budget_max_connu != null && prix <= Number(client.budget_max_connu)) {
      score += 10;
      reasons.push(`Prix sous son budget maximum connu`);
    } else if (achats.length) {
      const prixAchats = achats.map(a => Number(a.prix || 0)).filter(p => p > 0);
      if (prixAchats.length) {
        const moyenne = prixAchats.reduce((s, p) => s + p, 0) / prixAchats.length;
        if (moyenne > 0 && Math.abs(prix - moyenne) / moyenne <= 0.3) {
          score += 10;
          reasons.push(`Prix proche de ses achats précédents (moyenne ${Math.round(moyenne)} €)`);
        }
      }
    }

    return { score: Math.min(score, 100), reasons };
  }

  function genererMessage(client, produit, reasons) {
    const raisonPrincipale = reasons[0] ? reasons[0].charAt(0).toLowerCase() + reasons[0].slice(1) : null;
    const phraseRaison = raisonPrincipale ? ` Je me suis dit que ça pourrait t'intéresser vu que ${raisonPrincipale}.` : '';
    const prixTxt = produit.prix ? ` à ${produit.prix} €` : '';
    return `Salut ${client.prenom}, j'ai reçu ${produit.nom}${prixTxt}.${phraseRaison} Si tu veux, je peux t'envoyer les photos et les détails.`;
  }

  function priorityInfo(score) {
    if (score >= 80) return { label: '🔴 Priorité élevée', cls: 'high' };
    if (score >= 50) return { label: '🟠 Priorité moyenne', cls: 'medium' };
    return { label: '🟡 Opportunité', cls: 'low' };
  }

  let activeMatches = [];

  async function loadOpportunites() {
    const [{ data: clientsRaw }, { data: produits }, { data: propositions }, { data: achats }] = await Promise.all([
      sb.from('clients').select('*'),
      sb.from('produits').select('*').neq('statut', 'vendu'),
      sb.from('propositions').select('*'),
      sb.from('achats').select('*'),
    ]);

    const clients = (clientsRaw || []).filter(c => c.recoit_propositions !== false);

    if (!clients || !produits) {
      oppListEl.innerHTML = '<div class="empty">Erreur de chargement.</div>';
      return;
    }

    const achatsParClient = {};
    (achats || []).forEach(a => {
      if (!achatsParClient[a.client_id]) achatsParClient[a.client_id] = [];
      achatsParClient[a.client_id].push(a);
    });

    const propMap = {};
    (propositions || []).forEach(p => { propMap[p.client_id + '_' + p.produit_id] = p; });

    const matches = [];
    clients.forEach(client => {
      produits.forEach(produit => {
        const { score, reasons } = computeMatch(client, produit, achatsParClient[client.id]);
        if (score <= 0) return;
        const key = client.id + '_' + produit.id;
        const existing = propMap[key];
        const statut = existing ? existing.statut : 'a_proposer';
        matches.push({ client, produit, score, reasons, statut, key });
      });
    });

    // Opportunités actives : pas encore traitées
    activeMatches = matches
      .filter(m => m.statut === 'a_proposer')
      .sort((a, b) => b.score - a.score);

    if (!activeMatches.length) {
      oppListEl.innerHTML = '<div class="empty">Aucune opportunité pour l\'instant.</div>';
    } else {
      oppListEl.innerHTML = activeMatches.map((m, i) => {
        const prio = priorityInfo(m.score);
        return `
          <div class="opp-card ${prio.cls}">
            <div class="opp-head">
              <div>
                <div class="opp-title">${m.client.prenom} ${m.client.nom || ''}</div>
                <div class="opp-sub">${m.produit.nom} — ${m.produit.prix} €</div>
              </div>
              <span class="opp-score ${prio.cls}">${m.score}%</span>
            </div>
            <div class="opp-reasons">${m.reasons.map(r => `<div>✓ ${r}</div>`).join('')}</div>
            <div class="opp-actions">
              <button type="button" class="msg-btn" data-index="${i}">✉️ Préparer un message</button>
              <button type="button" class="primary act-btn" data-index="${i}" data-action="propose">Marquer comme proposé</button>
              <button type="button" class="act-btn" data-index="${i}" data-action="ignore">Ignorer</button>
              <button type="button" class="act-btn" data-index="${i}" data-action="pas_interesse">Pas intéressé</button>
            </div>
            <div class="msg-box" id="opp-msg-box-${i}">
              <textarea id="opp-msg-text-${i}" rows="4"></textarea>
              <button type="button" class="msg-copy" data-index="${i}">Copier le message</button>
            </div>
          </div>
        `;
      }).join('');

      oppListEl.querySelectorAll('.msg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = btn.dataset.index;
          const box = document.getElementById(`opp-msg-box-${i}`);
          const textarea = document.getElementById(`opp-msg-text-${i}`);
          if (box.style.display !== 'block') {
            const m = activeMatches[i];
            textarea.value = genererMessage(m.client, m.produit, m.reasons);
            box.style.display = 'block';
          } else {
            box.style.display = 'none';
          }
        });
      });

      oppListEl.querySelectorAll('.msg-copy').forEach(btn => {
        btn.addEventListener('click', async () => {
          const i = btn.dataset.index;
          const textarea = document.getElementById(`opp-msg-text-${i}`);
          try {
            await navigator.clipboard.writeText(textarea.value);
            btn.textContent = 'Copié !';
            setTimeout(() => { btn.textContent = 'Copier le message'; }, 1500);
          } catch { textarea.select(); }
        });
      });

      oppListEl.querySelectorAll('.act-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const i = btn.dataset.index;
          const m = activeMatches[i];
          const action = btn.dataset.action;

          const payload = {
            client_id: m.client.id,
            produit_id: m.produit.id,
            score: m.score,
            raison: m.reasons.join(' · '),
            statut: action,
          };
          if (action === 'propose') payload.date_proposition = new Date().toISOString();

          const { error } = await sb.from('propositions').upsert(payload, { onConflict: 'client_id,produit_id' });
          if (error) {
            alert('Erreur : ' + error.message);
            return;
          }
          loadOpportunites();
        });
      });
    }

    // Suivi : propositions déjà traitées
    const suivi = matches.filter(m => m.statut !== 'a_proposer').sort((a, b) => b.score - a.score);
    renderSuivi(suivi);
  }

  const STATUTS_SUIVI = [
    { value: 'propose', label: 'Proposé' },
    { value: 'interesse', label: 'Intéressé' },
    { value: 'pas_interesse', label: 'Pas intéressé' },
    { value: 'achete', label: 'Acheté' },
    { value: 'refuse', label: 'Refusé' },
    { value: 'ignore', label: 'Ignoré' },
  ];

  function renderSuivi(suivi) {
    if (!suivi.length) {
      suiviListEl.innerHTML = '<div class="empty">Aucune proposition suivie pour l\'instant.</div>';
      return;
    }

    suiviListEl.innerHTML = suivi.map(m => `
      <div class="suivi-card">
        <div class="suivi-info">
          <div class="name">${m.client.prenom} ${m.client.nom || ''} — ${m.produit.nom}</div>
          <div class="meta">${m.produit.prix} € · ${m.score}% de correspondance</div>
        </div>
        <select class="suivi-select" data-client="${m.client.id}" data-produit="${m.produit.id}">
          ${STATUTS_SUIVI.map(s => `<option value="${s.value}" ${s.value === m.statut ? 'selected' : ''}>${s.label}</option>`).join('')}
        </select>
      </div>
    `).join('');

    suiviListEl.querySelectorAll('.suivi-select').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        const { error } = await sb.from('propositions')
          .update({ statut: e.target.value, date_reponse: new Date().toISOString() })
          .eq('client_id', e.target.dataset.client)
          .eq('produit_id', e.target.dataset.produit);
        if (error) alert('Erreur : ' + error.message);
      });
    });
  }

  loadOpportunites();
</script>

</body>
</html>
