<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Hub — Clients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #14120f;
    --bg-panel: #1c1914;
    --bg-panel-raised: #242019;
    --border: #332d24;
    --gold: #c9a35f;
    --gold-soft: rgba(201, 163, 95, 0.14);
    --text: #ede7db;
    --text-dim: #a89d89;
    --text-faint: #6f6455;
    --danger: #c47456;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .shell {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  header.top h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.2px;
    margin: 0;
  }

  header.top .tag {
    color: var(--text-faint);
    font-size: 13px;
  }

  nav.tabs { display: flex; gap: 18px; margin: 0 0 32px; }
  nav.tabs a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    padding-bottom: 6px;
    border-bottom: 2px solid transparent;
  }
  nav.tabs a.active { color: var(--gold); border-color: var(--gold); }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 28px;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
  }

  .panel h2 {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 18px;
    color: var(--gold);
  }

  label {
    display: block;
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 14px 0 5px;
  }

  label:first-of-type { margin-top: 0; }

  input, select {
    width: 100%;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--gold);
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .hint {
    font-size: 11.5px;
    color: var(--text-faint);
    margin-top: 4px;
  }

  button.primary {
    margin-top: 20px;
    width: 100%;
    background: var(--gold);
    color: #1c1914;
    border: none;
    padding: 11px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  #form-msg {
    margin-top: 12px;
    font-size: 13px;
  }
  #form-msg.error { color: var(--danger); }
  #form-msg.ok { color: var(--gold); }

  .client-list { display: flex; flex-direction: column; gap: 10px; }

  .client-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .client-card:hover { border-color: var(--gold); }

  .client-card .name {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
  }

  .client-card .meta {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 3px;
  }

  .chip {
    display: inline-block;
    background: var(--gold-soft);
    color: var(--gold);
    border-radius: var(--radius);
    padding: 2px 8px;
    font-size: 11.5px;
    margin: 6px 4px 0 0;
  }

  .empty {
    color: var(--text-faint);
    font-size: 14px;
    padding: 20px 0;
    text-align: center;
  }

  /* Detail overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 7, 0.72);
    align-items: flex-start;
    justify-content: center;
    padding: 60px 20px;
    z-index: 10;
  }
  .overlay.open { display: flex; }

  .detail {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-width: 520px;
    width: 100%;
    padding: 28px;
    max-height: 80vh;
    overflow-y: auto;
  }

  .detail-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .detail h3 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    margin: 0;
  }

  .detail .close {
    cursor: pointer;
    color: var(--text-faint);
    font-size: 20px;
    line-height: 1;
    background: none;
    border: none;
  }

  .detail .sub { color: var(--text-faint); font-size: 13px; margin-bottom: 20px; }

  .detail-section {
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 14px;
  }

  .detail-section h4 {
    font-size: 12px;
    text-transform: none;
    color: var(--text-dim);
    margin: 0 0 8px;
  }

  .achat-line {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .achat-line:last-child { border-bottom: none; }
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <h1>Business Hub</h1>
    <span class="tag">Clients — AYL Conciergerie / NexTCG</span>
  </header>

  <nav class="tabs">
    <a href="index.html" class="active">Clients</a>
    <a href="stock.html">Stock</a>
    <a href="opportunites.html">Opportunités</a>
  </nav>

  <div class="layout">
    <div class="panel">
      <h2>Ajouter un client</h2>
      <form id="client-form">
        <label for="prenom">Prénom *</label>
        <input id="prenom" required>

        <label for="nom">Nom</label>
        <input id="nom">

        <div class="row2">
          <div>
            <label for="email">Email</label>
            <input id="email" type="email">
          </div>
          <div>
            <label for="telephone">Téléphone</label>
            <input id="telephone">
          </div>
        </div>

        <label for="categories">Catégories préférées</label>
        <input id="categories" placeholder="montres, billetterie, sneakers">
        <div class="hint">Séparées par des virgules</div>

        <label for="marques">Marques préférées</label>
        <input id="marques" placeholder="Rolex, Nike, Jordan">
        <div class="hint">Séparées par des virgules</div>

        <div class="row2">
          <div>
            <label for="budget_min">Budget min (€)</label>
            <input id="budget_min" type="number" min="0">
          </div>
          <div>
            <label for="budget_max">Budget max (€)</label>
            <input id="budget_max" type="number" min="0">
          </div>
        </div>

        <button type="submit" class="primary">Ajouter le client</button>
        <div id="form-msg"></div>
      </form>
    </div>

    <div class="panel">
      <h2>Clients enregistrés</h2>
      <div id="client-list" class="client-list">
        <div class="empty">Chargement…</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="detail">
    <div class="detail-head">
      <h3 id="detail-name">—</h3>
      <button class="close" id="detail-close">&times;</button>
    </div>
    <div class="sub" id="detail-contact">—</div>

    <div class="detail-section">
      <h4>Préférences</h4>
      <div id="detail-prefs">—</div>
    </div>

    <div class="detail-section">
      <h4>Budget</h4>
      <div id="detail-budget">—</div>
    </div>

    <div class="detail-section">
      <h4>Historique d'achats</h4>
      <div id="detail-achats"></div>
    </div>

    <div class="detail-section">
      <h4>Demandes (sourcing)</h4>
      <div id="detail-demandes"></div>

      <form id="demande-form" style="margin-top:12px;">
        <input id="demande-description" placeholder="Ex: Rolex Submariner" required>
        <div class="row2" style="margin-top:8px;">
          <input id="demande-categorie" placeholder="Catégorie (ex: Billetterie)">
          <input id="demande-marque" placeholder="Marque (ex: Rolex)">
        </div>
        <input id="demande-budget" type="number" min="0" placeholder="Budget max (€)" style="margin-top:8px;">
        <button type="submit" class="primary" style="margin-top:10px;">+ Enregistrer la demande</button>
        <div id="demande-msg"></div>
      </form>
    </div>
  </div>
</div>

<script>
  // ---- Configuration Supabase ----
  const SUPABASE_URL = "https://ziacdbshrsklftxlkcyo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppYWNkYnNocnNrbGZ0eGxrY3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDcyOTUsImV4cCI6MjEwNDk4MzI5NX0.9gMbDnuJ9ZMHIR-a-LUuq1iyD-Un-qaLOTVfZLOQZ8E";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const listEl = document.getElementById('client-list');
  const formEl = document.getElementById('client-form');
  const msgEl = document.getElementById('form-msg');

  function toArray(str) {
    return str.split(',').map(s => s.trim()).filter(Boolean);
  }

  async function loadClients() {
    const { data, error } = await sb
      .from('clients')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty">Erreur de chargement : ${error.message}</div>`;
      return;
    }

    if (!data.length) {
      listEl.innerHTML = `<div class="empty">Aucun client pour l'instant.</div>`;
      return;
    }

    listEl.innerHTML = '';
    data.forEach(client => {
      const card = document.createElement('div');
      card.className = 'client-card';
      const cats = (client.categories_preferees || []).map(c => `<span class="chip">${c}</span>`).join('');
      card.innerHTML = `
        <div class="name">${client.prenom} ${client.nom || ''}</div>
        <div class="meta">${client.email || ''} ${client.telephone ? '· ' + client.telephone : ''}</div>
        <div>${cats}</div>
      `;
      card.addEventListener('click', () => openDetail(client));
      listEl.appendChild(card);
    });
  }

  async function openDetail(client) {
    document.getElementById('detail-name').textContent = `${client.prenom} ${client.nom || ''}`;
    document.getElementById('detail-contact').textContent =
      [client.email, client.telephone].filter(Boolean).join(' · ') || 'Aucun contact renseigné';

    const cats = (client.categories_preferees || []).map(c => `<span class="chip">${c}</span>`).join('');
    const marques = (client.marques_preferees || []).map(c => `<span class="chip">${c}</span>`).join('');
    document.getElementById('detail-prefs').innerHTML = (cats + marques) || '<span class="hint">Aucune préférence renseignée</span>';

    const budgetTxt = (client.budget_min || client.budget_max)
      ? `${client.budget_min ?? '?'} € — ${client.budget_max ?? '?'} €`
      : 'Non renseigné';
    document.getElementById('detail-budget').textContent = budgetTxt;

    const achatsEl = document.getElementById('detail-achats');
    achatsEl.innerHTML = 'Chargement…';

    const { data: achats, error } = await sb
      .from('achats')
      .select('*')
      .eq('client_id', client.id)
      .order('date_achat', { ascending: false });

    if (error) {
      achatsEl.innerHTML = `<div class="hint">Erreur : ${error.message}</div>`;
    } else if (!achats.length) {
      achatsEl.innerHTML = `<div class="hint">Aucun achat enregistré pour l'instant.</div>`;
    } else {
      achatsEl.innerHTML = achats.map(a => `
        <div class="achat-line">
          <span>${a.nom_produit} <span class="hint">(${a.date_achat})</span></span>
          <span>${a.prix} €</span>
        </div>
      `).join('');
    }

    document.getElementById('overlay').classList.add('open');
    loadDemandes(client.id);
    currentDetailClient = client;
  }

  let currentDetailClient = null;

  async function loadDemandes(clientId) {
    const demandesEl = document.getElementById('detail-demandes');
    demandesEl.innerHTML = 'Chargement…';

    const { data: demandes, error } = await sb
      .from('demandes_client')
      .select('*')
      .eq('client_id', clientId)
      .order('created_at', { ascending: false });

    if (error) {
      demandesEl.innerHTML = `<div class="hint">Erreur : ${error.message}</div>`;
      return;
    }
    if (!demandes.length) {
      demandesEl.innerHTML = `<div class="hint">Aucune demande enregistrée.</div>`;
      return;
    }

    const statutLabel = { recherche: '🔍 En recherche', trouve: '✅ Trouvé', annulee: '✕ Annulée' };
    demandesEl.innerHTML = demandes.map(d => `
      <div class="achat-line">
        <span>${d.description} ${d.budget_max ? `<span class="hint">(≤ ${d.budget_max} €)</span>` : ''}</span>
        <span class="hint">${statutLabel[d.statut] || d.statut}</span>
      </div>
    `).join('');
  }

  document.getElementById('demande-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgEl2 = document.getElementById('demande-msg');
    msgEl2.textContent = '';
    msgEl2.className = '';

    const description = document.getElementById('demande-description').value.trim();
    if (!description || !currentDetailClient) return;

    const payload = {
      client_id: currentDetailClient.id,
      description,
      categorie: document.getElementById('demande-categorie').value.trim() || null,
      marque: document.getElementById('demande-marque').value.trim() || null,
      budget_max: document.getElementById('demande-budget').value || null,
    };

    const { error } = await sb.from('demandes_client').insert(payload);
    if (error) {
      msgEl2.textContent = 'Erreur : ' + error.message;
      msgEl2.className = 'error';
      return;
    }

    document.getElementById('demande-form').reset();
    loadDemandes(currentDetailClient.id);
  });

  document.getElementById('detail-close').addEventListener('click', () => {
    document.getElementById('overlay').classList.remove('open');
  });
  document.getElementById('overlay').addEventListener('click', (e) => {
    if (e.target.id === 'overlay') e.target.classList.remove('open');
  });

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgEl.textContent = '';
    msgEl.className = '';

    const payload = {
      prenom: document.getElementById('prenom').value.trim(),
      nom: document.getElementById('nom').value.trim() || null,
      email: document.getElementById('email').value.trim() || null,
      telephone: document.getElementById('telephone').value.trim() || null,
      categories_preferees: toArray(document.getElementById('categories').value),
      marques_preferees: toArray(document.getElementById('marques').value),
      budget_min: document.getElementById('budget_min').value || null,
      budget_max: document.getElementById('budget_max').value || null,
    };

    if (!payload.prenom) {
      msgEl.textContent = 'Le prénom est obligatoire.';
      msgEl.className = 'error';
      return;
    }

    const submitBtn = formEl.querySelector('button');
    submitBtn.disabled = true;

    const { error } = await sb.from('clients').insert(payload);

    submitBtn.disabled = false;

    if (error) {
      msgEl.textContent = `Erreur : ${error.message}`;
      msgEl.className = 'error';
      return;
    }

    msgEl.textContent = 'Client ajouté.';
    msgEl.className = 'ok';
    formEl.reset();
    loadClients();
  });

  loadClients();
</script>

</body>
</html>
