<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Hub — Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #14120f;
    --bg-panel: #1c1914;
    --bg-panel-raised: #242019;
    --border: #332d24;
    --gold: #c9a35f;
    --gold-soft: rgba(201, 163, 95, 0.14);
    --green: #7fa46b;
    --green-soft: rgba(127, 164, 107, 0.14);
    --text: #ede7db;
    --text-dim: #a89d89;
    --text-faint: #6f6455;
    --danger: #c47456;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .shell { max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  header.top h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; margin: 0; }
  header.top .tag { color: var(--text-faint); font-size: 13px; }

  nav.tabs { display: flex; gap: 18px; margin: 20px 0 32px; }
  nav.tabs a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    padding-bottom: 6px;
    border-bottom: 2px solid transparent;
  }
  nav.tabs a.active { color: var(--gold); border-color: var(--gold); }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 28px; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 24px;
  }

  .panel h2 {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 18px;
    color: var(--gold);
  }

  label { display: block; font-size: 12.5px; color: var(--text-dim); margin: 14px 0 5px; }
  label:first-of-type { margin-top: 0; }

  input, select {
    width: 100%;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--gold); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .hint { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }

  button.primary {
    margin-top: 20px;
    width: 100%;
    background: var(--gold);
    color: #1c1914;
    border: none;
    padding: 11px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  #form-msg { margin-top: 12px; font-size: 13px; }
  #form-msg.error { color: var(--danger); }
  #form-msg.ok { color: var(--gold); }

  .item-list { display: flex; flex-direction: column; gap: 10px; }

  .item-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }

  .item-card .name { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; }
  .item-card .meta { color: var(--text-dim); font-size: 13px; margin-top: 3px; }
  .item-card .price { color: var(--gold); font-weight: 600; }
  .item-card .objectif { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }

  .item-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .item-card .info { flex: 1; }
  .item-card.vendu { opacity: 0.55; }

  .statut-select {
    width: auto;
    padding: 6px 8px;
    font-size: 12.5px;
  }

  .empty { color: var(--text-faint); font-size: 14px; padding: 20px 0; text-align: center; }

  /* Matching results */
  .match-card {
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .match-card.low { border-left-color: var(--text-faint); }
  .match-head { display: flex; justify-content: space-between; align-items: baseline; }
  .match-name { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; }
  .match-score {
    background: var(--green-soft);
    color: var(--green);
    padding: 2px 9px;
    border-radius: var(--radius);
    font-size: 12.5px;
    font-weight: 600;
  }
  .match-reasons { margin-top: 6px; font-size: 13px; color: var(--text-dim); }
  .match-reasons div { margin-top: 2px; }

  /* Modale de vente */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 7, 0.72);
    align-items: flex-start;
    justify-content: center;
    padding: 60px 20px;
    z-index: 10;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-width: 420px;
    width: 100%;
    padding: 26px;
  }

  .modal h3 {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    margin: 0 0 4px;
  }

  .modal .sub { color: var(--text-faint); font-size: 13px; margin-bottom: 18px; }

  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-size: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .modal-actions .confirm { background: var(--gold); color: #1c1914; border: none; font-weight: 600; }
  .modal-actions .cancel { background: transparent; color: var(--text-dim); }
  #vente-msg { margin-top: 10px; font-size: 13px; }
  #vente-msg.error { color: var(--danger); }
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <h1>Business Hub</h1>
    <span class="tag">Stock — AYL Conciergerie / NexTCG</span>
  </header>

  <nav class="tabs">
    <a href="index.html">Clients</a>
    <a href="stock.html" class="active">Stock</a>
  </nav>

  <div class="layout">
    <div>
      <div class="panel">
        <h2>Ajouter un article</h2>
        <form id="produit-form">
          <label for="nom">Nom *</label>
          <input id="nom" required placeholder="Rolex Datejust">

          <label for="categorie">Catégorie *</label>
          <select id="categorie" required>
            <option value="">— Choisir —</option>
            <option value="Montres">Montres</option>
            <option value="Billetterie">Billetterie</option>
            <option value="Sneakers">Sneakers</option>
            <option value="Vêtements">Vêtements</option>
            <option value="Sacs">Sacs</option>
            <option value="Pokémon / TCG">Pokémon / TCG</option>
            <option value="Bijoux">Bijoux</option>
            <option value="autre">Autre…</option>
          </select>
          <input id="categorie_autre" placeholder="Précise la catégorie" style="display:none; margin-top:8px;">

          <label for="marque">Marque</label>
          <input id="marque" placeholder="Rolex">

          <div class="row2">
            <div>
              <label for="prix">Prix (€) *</label>
              <input id="prix" type="number" min="0" required>
            </div>
            <div>
              <label for="type_produit">Type</label>
              <select id="type_produit">
                <option value="">—</option>
                <option value="occasion">Occasion</option>
                <option value="neuf">Neuf</option>
                <option value="edition_limitee">Édition limitée</option>
                <option value="collector">Collector</option>
                <option value="vip">VIP</option>
              </select>
            </div>
          </div>

          <label for="objectif">Objectif</label>
          <select id="objectif">
            <option value="">—</option>
            <option value="investissement">Investissement (garder / faire fructifier)</option>
            <option value="revente_rapide">Revente rapide</option>
          </select>

          <button type="submit" class="primary">Ajouter au stock</button>
          <div id="form-msg"></div>
        </form>
      </div>
    </div>

    <div>
      <div class="panel" id="match-panel" style="display:none;">
        <h2>🎯 Clients potentiels</h2>
        <div id="match-results"></div>
      </div>

      <div class="panel">
        <h2>Stock actuel</h2>
        <div id="produit-list" class="item-list">
          <div class="empty">Chargement…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="vente-overlay">
  <div class="modal">
    <h3>Marquer comme vendu</h3>
    <div class="sub" id="vente-produit-nom">—</div>

    <label for="vente-client">Client *</label>
    <select id="vente-client">
      <option value="">— Choisir un client —</option>
    </select>

    <label for="vente-prix">Prix de vente (€) *</label>
    <input id="vente-prix" type="number" min="0">

    <label for="vente-date">Date de vente *</label>
    <input id="vente-date" type="date">

    <div id="vente-msg"></div>

    <div class="modal-actions">
      <button class="cancel" id="vente-cancel">Annuler</button>
      <button class="confirm" id="vente-confirm">Confirmer la vente</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://ziacdbshrsklftxlkcyo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppYWNkYnNocnNrbGZ0eGxrY3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDcyOTUsImV4cCI6MjEwNDk4MzI5NX0.9gMbDnuJ9ZMHIR-a-LUuq1iyD-Un-qaLOTVfZLOQZ8E";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const listEl = document.getElementById('produit-list');
  const formEl = document.getElementById('produit-form');
  const msgEl = document.getElementById('form-msg');
  const matchPanel = document.getElementById('match-panel');
  const matchResults = document.getElementById('match-results');

  const categorieSelect = document.getElementById('categorie');
  const categorieAutre = document.getElementById('categorie_autre');
  categorieSelect.addEventListener('change', () => {
    categorieAutre.style.display = categorieSelect.value === 'autre' ? 'block' : 'none';
  });

  async function loadProduits() {
    const { data, error } = await sb.from('produits').select('*').order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`;
      return;
    }
    if (!data.length) {
      listEl.innerHTML = `<div class="empty">Aucun article en stock.</div>`;
      return;
    }

    // Les articles vendus descendent en bas de la liste
    data.sort((a, b) => {
      if (a.statut === 'vendu' && b.statut !== 'vendu') return 1;
      if (a.statut !== 'vendu' && b.statut === 'vendu') return -1;
      return 0;
    });

    listEl.innerHTML = '';
    data.forEach(p => {
      const card = document.createElement('div');
      card.className = 'item-card' + (p.statut === 'vendu' ? ' vendu' : '');
      const objectifLabel = p.objectif === 'investissement' ? '💼 Investissement'
        : p.objectif === 'revente_rapide' ? '⚡ Revente rapide' : '';
      card.innerHTML = `
        <div class="info">
          <div class="name">${p.nom}</div>
          <div class="meta">${p.categorie}${p.marque ? ' · ' + p.marque : ''} · <span class="price">${p.prix} €</span></div>
          ${objectifLabel ? `<div class="objectif">${objectifLabel}</div>` : ''}
        </div>
        <select class="statut-select" data-id="${p.id}" data-nom="${p.nom}" data-categorie="${p.categorie}" data-marque="${p.marque || ''}" data-prix="${p.prix}" data-current="${p.statut}">
          <option value="disponible" ${p.statut === 'disponible' ? 'selected' : ''}>Disponible</option>
          <option value="reserve" ${p.statut === 'reserve' ? 'selected' : ''}>Réservé</option>
          <option value="vendu" ${p.statut === 'vendu' ? 'selected' : ''}>Vendu</option>
        </select>
      `;
      listEl.appendChild(card);
    });

    listEl.querySelectorAll('.statut-select').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        const target = e.target;
        if (target.value === 'vendu') {
          openVenteModal(target);
          return;
        }
        const { error } = await sb.from('produits')
          .update({ statut: target.value })
          .eq('id', target.dataset.id);
        if (error) {
          alert('Erreur lors de la mise à jour : ' + error.message);
          target.value = target.dataset.current;
          return;
        }
        loadProduits();
      });
    });
  }

  // --- Matching par règles simples ---
  // Score : catégorie (40) + marque (40) + budget (20)
  function computeMatch(client, produit) {
    let score = 0;
    const reasons = [];

    const cats = (client.categories_preferees || []).map(c => c.toLowerCase());
    const marques = (client.marques_preferees || []).map(m => m.toLowerCase());

    if (cats.includes(produit.categorie.toLowerCase())) {
      score += 40;
      reasons.push(`Intéressé par la catégorie « ${produit.categorie} »`);
    }

    if (produit.marque && marques.includes(produit.marque.toLowerCase())) {
      score += 40;
      reasons.push(`A déjà une préférence pour la marque ${produit.marque}`);
    }

    const min = client.budget_min != null ? Number(client.budget_min) : null;
    const max = client.budget_max != null ? Number(client.budget_max) : null;
    const prix = Number(produit.prix);

    if (min != null && max != null) {
      if (prix >= min && prix <= max) {
        score += 20;
        reasons.push(`Prix dans son budget habituel (${min} € – ${max} €)`);
      }
    } else if (client.budget_max_connu != null && prix <= Number(client.budget_max_connu)) {
      score += 10;
      reasons.push(`Prix sous son budget maximum connu`);
    }

    return { score, reasons };
  }

  async function runMatching(produit) {
    const { data: clients, error } = await sb.from('clients').select('*');
    if (error || !clients.length) return;

    const matches = clients
      .map(client => ({ client, ...computeMatch(client, produit) }))
      .filter(m => m.score > 0)
      .sort((a, b) => b.score - a.score);

    if (!matches.length) {
      matchPanel.style.display = 'none';
      return;
    }

    matchResults.innerHTML = matches.map(m => `
      <div class="match-card ${m.score < 40 ? 'low' : ''}">
        <div class="match-head">
          <span class="match-name">${m.client.prenom} ${m.client.nom || ''}</span>
          <span class="match-score">${m.score}%</span>
        </div>
        <div class="match-reasons">${m.reasons.map(r => `<div>✓ ${r}</div>`).join('')}</div>
      </div>
    `).join('');

    matchPanel.style.display = 'block';
  }

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgEl.textContent = '';
    msgEl.className = '';

    const categorieValue = categorieSelect.value === 'autre'
      ? categorieAutre.value.trim()
      : categorieSelect.value;

    const payload = {
      nom: document.getElementById('nom').value.trim(),
      categorie: categorieValue,
      marque: document.getElementById('marque').value.trim() || null,
      prix: document.getElementById('prix').value,
      type_produit: document.getElementById('type_produit').value || null,
      objectif: document.getElementById('objectif').value || null,
    };

    if (!payload.nom || !payload.categorie || !payload.prix) {
      msgEl.textContent = 'Nom, catégorie et prix sont obligatoires.';
      msgEl.className = 'error';
      return;
    }

    const submitBtn = formEl.querySelector('button');
    submitBtn.disabled = true;

    const { data, error } = await sb.from('produits').insert(payload).select().single();

    submitBtn.disabled = false;

    if (error) {
      msgEl.textContent = `Erreur : ${error.message}`;
      msgEl.className = 'error';
      return;
    }

    msgEl.textContent = 'Article ajouté.';
    msgEl.className = 'ok';
    formEl.reset();
    categorieAutre.style.display = 'none';
    loadProduits();
    runMatching(data);
  });

  // --- Modale de vente ---
  const venteOverlay = document.getElementById('vente-overlay');
  const venteClientSelect = document.getElementById('vente-client');
  const ventePrixInput = document.getElementById('vente-prix');
  const venteDateInput = document.getElementById('vente-date');
  const venteMsg = document.getElementById('vente-msg');
  const venteProduitNom = document.getElementById('vente-produit-nom');
  let currentVenteSelect = null;

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  async function openVenteModal(selectEl) {
    currentVenteSelect = selectEl;
    venteMsg.textContent = '';
    venteProduitNom.textContent = selectEl.dataset.nom;
    ventePrixInput.value = selectEl.dataset.prix;
    venteDateInput.value = todayStr();

    venteClientSelect.innerHTML = '<option value="">Chargement…</option>';
    const { data: clients, error } = await sb.from('clients').select('id, prenom, nom').order('prenom');
    if (error) {
      venteClientSelect.innerHTML = '<option value="">Erreur de chargement</option>';
    } else {
      venteClientSelect.innerHTML = '<option value="">— Choisir un client —</option>' +
        clients.map(c => `<option value="${c.id}">${c.prenom} ${c.nom || ''}</option>`).join('');
    }

    venteOverlay.classList.add('open');
  }

  function closeVenteModal(revert) {
    if (revert && currentVenteSelect) {
      currentVenteSelect.value = currentVenteSelect.dataset.current;
    }
    venteOverlay.classList.remove('open');
    currentVenteSelect = null;
  }

  document.getElementById('vente-cancel').addEventListener('click', () => closeVenteModal(true));
  venteOverlay.addEventListener('click', (e) => {
    if (e.target.id === 'vente-overlay') closeVenteModal(true);
  });

  document.getElementById('vente-confirm').addEventListener('click', async () => {
    const clientId = venteClientSelect.value;
    const prixVente = ventePrixInput.value;
    const dateVente = venteDateInput.value;

    if (!clientId || !prixVente || !dateVente) {
      venteMsg.textContent = 'Client, prix et date sont obligatoires.';
      venteMsg.className = 'error';
      return;
    }

    const sel = currentVenteSelect;

    // 1. Enregistrer l'achat côté client
    const { error: achatError } = await sb.from('achats').insert({
      client_id: clientId,
      produit_id: sel.dataset.id,
      nom_produit: sel.dataset.nom,
      categorie: sel.dataset.categorie,
      marque: sel.dataset.marque || null,
      prix: prixVente,
      date_achat: dateVente,
    });

    if (achatError) {
      venteMsg.textContent = 'Erreur : ' + achatError.message;
      venteMsg.className = 'error';
      return;
    }

    // 2. Marquer le produit comme vendu
    const { error: produitError } = await sb.from('produits')
      .update({ statut: 'vendu' })
      .eq('id', sel.dataset.id);

    if (produitError) {
      venteMsg.textContent = 'Erreur : ' + produitError.message;
      venteMsg.className = 'error';
      return;
    }

    closeVenteModal(false);
    loadProduits();
  });

  loadProduits();
</script>

</body>
</html>
